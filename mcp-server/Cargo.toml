[package]
name = "ops-telemetry-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1", features = ["process", "time"] }
